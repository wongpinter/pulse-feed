name: Android

# CI covers the Android app only for now. The desktop (jpackage) and iOS (Xcode)
# verification jobs need runner platforms this project does not have yet; their
# packaging scripts stay in the repository and can be restored when they do.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: CI scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test CI scripts
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

  test:
    name: Android host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Run Android host tests
        run: >-
          ./gradlew
          :resources:verifyGeneratedAdblocklist
          :core:testAndroidHostTest
          :ui:testAndroidHostTest
          :app:testDebugUnitTest
          --warning-mode all
          --no-daemon
          --max-workers=2
          --parallel
      - name: Upload JVM test reports on failure
        if: failure()
        # Diagnostics are useful, but an artifact-service outage must not decide test status.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Build debug APK
        run: >-
          ./gradlew
          :app:assembleDebug
          --warning-mode all
          --no-daemon
          --max-workers=2
      - uses: actions/upload-artifact@v7
        with:
          name: pulsefeed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error